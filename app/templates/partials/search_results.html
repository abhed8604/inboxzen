{% for email in emails %}
<div class="search-result-item" data-email-id="{{ email.id }}">
    <div class="search-avatar" style="background-color: {{ email.account.color }};">
        {{ get_initials(email.sender) }}
    </div>
    <div class="search-info">
        <div class="search-sender">{{ email.sender.split('<')[0].strip() if '<' in email.sender else email.sender }}</div>
        <div class="search-subject">{{ email.subject }}</div>
    </div>
</div>
{% endfor %}
{% if not emails %}
<div class="search-empty">No results found</div>
{% endif %}
